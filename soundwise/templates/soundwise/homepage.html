
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load sass_tags %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.1/css/all.css" crossorigin="anonymous">
   <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito&display=swap');
      </style>
    <link rel="stylesheet" href="../../static/css/style.css">

    <title>SoundWise</title>
</head>
<body class="bg-light body" style="font-family: 'Nunito', sans-serif;">
   
  
    <!--NAV BAR-->
    <nav class="navbar navbar-expand-lg w-100 bg-white shadow-lg p-3 mb-1">
        <div class="container-fluid border">
          <a class="navbar-brand" href="{% url 'home' %}"><img src="../../../static/images/Soumdwise logo.jpeg"></a>


         
                   <div class="collapse navbar-collapse justify-content-end bg-white" id="navbarNavDropdown">
            <ul class="navbar-nav ">

              <li class="nav-item">
                <a class="nav-link" href="" aria-selected="false">FAQ?</a>
              </li>
                {% if request.user.is_authenticated %}
              <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                  <i class="fa fa-user m-2 fw-bold" style="color:#1A48D4;"></i>
                </a>

                <ul class="dropdown-menu dropdown-menu-end">
                  <li><a class="dropdown-item" href="{% url 'account-info' %}">User Profile</a></li>
                  <li> <a href="{% url 'logout' %}" class="dropdown-item text-danger">Logout</a></li>
                </ul>
                  {% else %}
                  <a class="nav-link dropdown-toggle" href="{% url 'login' %}"  aria-expanded="false">
                  <i class="fa fa-user m-2 fw-bold" style="color:#1A48D4;"></i>
                  </a>
                  {% endif %}
              </li>
            </ul>
          </div>
        </div>
    </nav>
    <!--NAV BAR-->



    <!--MAIN CONTAINER FOR CONTENT-->
    <div class="container-fluid main-container"> 
    <div class="bg-white align-items-center justify-content-center my-5 border shadow-md p-5 container-wrap">
            <div>
              <header>
                <h3 class="text-center">Upload Away</h3>
              </header>

                  <!--NAV-TAB-->
                  <div>           
                        <ul class="nav nav-pills mb-4" id="myTab" role="tablist">
                            <li class="nav-item" role="presentation">
                              <button class="nav-link active" id="pills-monitoring-tab" data-bs-toggle="pill" data-bs-target="#pills-monitoring" type="button" role="tab" aria-controls="pills-monitoring" aria-selected="true">Audio</button>
                            </li>
                  
                            <li class="nav-item  d-flex justify-content-between" role="presentation">
                              <button class="nav-link" id="pills-surge-tab" data-bs-toggle="pill" data-bs-target="#pills-surge" type="button" role="tab" aria-controls="pills-surge" aria-selected="false">Video</button>
                            </li>
                          </ul>

                          <!--TABS CONTENT-->
                          <div class="tab-content" id="pills-tabContent">
                            
                            <!--AUDIO TAB-->
                            <div class="tab-pane fade show active " id="pills-monitoring" role="tabpanel" aria-labelledby="pills-monitoring-tab" tabindex="0">
                             
                              <form id="audioUploadForm" enctype="multipart/form-data" class="d-flex upload-wrapper">
                                  {% csrf_token %}
                                <input type="file" id="audioFileInput" name="audioFile" accept="audio/*" class="form-control me-3"  placeholder="Upload Audio File">
                                <label>Summarize</label>
                                <input type="checkbox" id="summarizeCheckbox" name="summarize" value="1">
                                <button type="submit" class="btn btn-primary">Upload Audio</button>
                              </form>
                      
                              </div>

                                <div class="row transcribed-text">

                                    <!--TEXT BOX-->
                                    <div class="col">

                                      <div class="card mb-3 pends" >
                                        <div class="card-body d-flex align-items-center justify-content-between">
                                          <textarea class="form-control" id="Textarea1" rows="8" placeholder="Transcribed text will appear here"></textarea>
                                        </div>
                                          <button id="downloadBtn" style="display: none;">Download PDF</button>
                                      </div>
                                      
                                    </div>
                                    <!--TEXT BOX-->
                            
                                  
                                </div>
                            
                            </div>
                            <!--AUDIO TAB-->
                          
                            <!--VIDEO TAB-->
                            <div class="tab-pane fade" id="pills-surge" role="tabpanel" aria-labelledby="pills-surge-tab" tabindex="0">
                              <div>
              
                              </div>
                            </div>
                            <!--VIDEO TAB-->


                          </div>
                          <!--TABS CONTENT-->

                  </div>
                  <!--NAV-TAB-->
          
            </div>
    </div>
    </div>
    <!--MAIN CONTAINER FOR CONTENT-->
       
    
   
     <!-- Loading overlay code -->
    <div id="loading-overlay" style="display: none;">
        <div class="loading-content">
          <div class="progress">
            <div class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
          </div>
        </div>
    </div>






















    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/printThis/1.15.0/printThis.min.js"></script>
    <script src="../../../static/js/main.js"></script>
    <script src="../../../static/js/test.js"></script>
</body>
</html>
