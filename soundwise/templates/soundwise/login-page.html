<!DOCTYPE html>
<!-- Coding by CodingLab | www.codinglabweb.com-->
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> SoundWise </title>

        <!-- CSS -->
        <link rel="stylesheet" href="../../../static/css/log-style.css">
                
        <!-- Boxicons CSS -->
        <link href='https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css' rel='stylesheet'>
                        
    </head>
    <body>
        <section class="container forms">
            <div class="form login">
                <div class="form-content">
                    <header>Login</header>
                    <form method="post">
                        {% csrf_token %}
                        <div class="field input-field">
                            <input type="text" placeholder="Username" name="username" class="input" id="emailInput" required>
                        </div>
    
                        <div class="field input-field">
                            <input type="password" name="password" placeholder="Password" class="password" id="passwordInput" required>
                            <i class='bx bx-hide eye-icon'></i>
                        </div>
    
                        <div class="form-link">
                            <a href="{% url 'password_reset' %}">Forgot password?</a>
                        </div>
    
                        <div class="field button-field">
                            <button type="submit">Login</button>
                        </div>
                        <div class="field button-field">
                            {% load socialaccount %}
<!--                            <h1>Google Login</h1>-->
                            <button type="button"><a href="{% provider_login_url 'google'%}?next=/">Login with Google</a></button>

                        </div>
                    </form>

                    <div class="form-link">
                        <span>Don't have an account? <a href="{% url 'signup' %}" class="link signup-link">Signup</a></span>
                    </div>
                </div>



            </div>
        </section>

        <!-- JavaScript -->

    </body>
</html>
